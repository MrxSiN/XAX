[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xax-compiler"
version = "0.1.0"
description = "Bootstrap implementation of the XAX canonical semantic store"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xaxc = "xax_compiler:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["blake3", "xax_accelerator", "xax_artifact", "xax_aarch64", "xax_android", "xax_android_components",
    "xax_apk", "xax_apk_signing", "xax_android_sdk",
    "xax_dex", "xax_bootstrap", "xax_build", "xax_compiler", "xax_graph_builder", "xax_jni", "xax_libxposed", "xax_linux",
    "xax_manifest", "xax_native_blake3", "xax_native_blake3_store", "xax_optimizer", "xax_platform", "xax_resources", "xax_selfhost", "xax_strings", "xax_wasm", "xax_wasm_legacy", "xax_workspace", "xax_x86_64"]

