[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xax-compiler"
version = "0.1.0"
description = "Bootstrap implementation of the XAX canonical semantic store"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "unicorn", "tiktoken"]

[project.scripts]
xaxc = "xax_compiler:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["blake3", "xax_accelerator", "xax_artifact", "xax_aarch64", "xax_android", "xax_android_components", "xax_android_counter", "xax_android_managed", "xax_android_platform",
    "xax_apk", "xax_apk_signing", "xax_android_sdk",
    "xax_dex", "xax_bootstrap", "xax_build", "xax_compiler", "xax_elf", "xax_graph_builder", "xax_inline", "xax_jni", "xax_jvm", "xax_libxposed", "xax_linux", "xax_linux_aarch64", "xax_spirv", "xax_structured", "xax_c_import", "xax_board", "xax_elf_link", "xax_stdlib",
    "xax_manifest", "xax_native_blake3", "xax_native_blake3_store", "xax_optimizer", "xax_pe", "xax_platform", "xax_replacement", "xax_status_docs", "xax_resources", "xax_riscv64", "xax_selfhost_riscv64", "xax_selfhost_blake3", "xax_selfhost_store", "xax_selfhost_graph", "xax_selfhost_cfg", "xax_selfhost_diagnostics", "xax_selfhost_typing", "xax_selfhost_facts", "xax_selfhost_target", "xax_selfhost_riscv64_backend", "xax_selfhost_verify", "xax_views_lowering", "xax_selfhost_views_backend", "xax_selfhost_x86_64_backend", "xax_x86_64_views", "xax_selfhost", "xax_strings", "xax_wasm", "xax_wasm_legacy", "xax_web", "xax_workspace", "xax_x86_64", "xax_x86_64_regalloc",
    "xax_aarch64_regalloc", "xax_jvm_bridge", "xax_jvm_import", "xax_local_protocol", "xax_construct", "xax_native", "xax_ranges", "xax_vector"]

# The canonical compiler stores the XAX-hosted components load (xax_native.bootstrap_dir).
[tool.setuptools.data-files]
"share/xax/bootstrap" = ["bootstrap/*.xax"]

