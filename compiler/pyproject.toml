[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xax-compiler"
version = "0.1.0"
description = "Bootstrap implementation of the XAX canonical semantic store"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "unicorn"]

[project.scripts]
xaxc = "xax_compiler:main"

# W4 (ADR-363): the top-level modules are every module in src/ (the native compiler's runners and tooling) and in
# reference/ (the Python reference compiler); setup.py lists them and its build_py finds each in its directory.

# The canonical compiler stores the XAX-hosted components load (xax_native.bootstrap_dir).
[tool.setuptools.data-files]
"share/xax/bootstrap" = ["bootstrap/*.xax"]
"share/xax/bootstrap/evolution" = ["bootstrap/evolution/LEDGER", "bootstrap/evolution/*.edit"]  # S15d.2 (ADR-305)
"share/xax/bfx" = ["integration/bfx/*.xax", "integration/bfx/*.json", "integration/bfx/*.md", "integration/bfx/*.edit"]

[tool.pytest.ini_options]
pythonpath = ["src", "reference", "."]
